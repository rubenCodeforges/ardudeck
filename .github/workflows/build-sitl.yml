name: Build ArduPilot SITL Binaries

# Builds SITL binaries for every ArduPilot vehicle (macOS arm64 and Linux x64)
# and uploads them to a sitl-v{version} pre-release.
# Windows users get binaries from firmware.ardupilot.org.
#
# ArduDeck downloads from:
#   https://github.com/rubenCodeforges/ardudeck/releases/download/sitl-v{version}/{binary}-{platform}

on:
  workflow_dispatch:
    inputs:
      ardupilot_ref:
        description: 'ArduPilot git ref (tag, branch, or SHA). E.g. Copter-4.5.7, master'
        required: true
        default: 'master'
      vehicles:
        description: 'waf vehicle targets (comma-separated)'
        required: true
        default: 'copter,heli,plane,rover,sub,antennatracker,blimp'

permissions:
  contents: write

env:
  DEFAULT_ARDUPILOT_REF: 'master'
  DEFAULT_VEHICLES: 'copter,heli,plane,rover,sub,antennatracker,blimp'
  GH_REPO: ${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        name: Determine version tag
        run: |
          REF="${{ inputs.ardupilot_ref || env.DEFAULT_ARDUPILOT_REF }}"
          if [[ "$REF" =~ ^[A-Za-z]+-([0-9]+\.[0-9]+.*) ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            VERSION="${REF}-$(date +%Y%m%d)"
          fi
          echo "tag=sitl-v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --prerelease \
            --title "ArduPilot SITL ${{ steps.tag.outputs.version }}" \
            --notes "SITL binaries for ArduDeck, built from ArduPilot ${{ inputs.ardupilot_ref || env.DEFAULT_ARDUPILOT_REF }}."

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux-x64
          - os: macos-14
            suffix: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout ArduPilot
        uses: actions/checkout@v4
        with:
          repository: ArduPilot/ardupilot
          ref: ${{ inputs.ardupilot_ref || env.DEFAULT_ARDUPILOT_REF }}
          submodules: recursive
          path: ardupilot

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ gawk git make cmake ccache libxml2-dev libxslt-dev

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install gawk

      - name: Install Python dependencies
        run: pip install empy==3.3.4 pexpect setuptools future dronecan lxml pymavlink

      - name: Configure SITL
        working-directory: ardupilot
        run: ./waf configure --board sitl

      - name: Build vehicles
        working-directory: ardupilot
        timeout-minutes: 60
        run: |
          VEHICLES="${{ inputs.vehicles || env.DEFAULT_VEHICLES }}"
          IFS=',' read -ra VEHICLE_LIST <<< "$VEHICLES"
          for v in "${VEHICLE_LIST[@]}"; do
            echo "::group::Building $v"
            ./waf "$v"
            echo "::endgroup::"
          done

      - name: Collect binaries
        run: |
          mkdir -p output
          for f in ardupilot/build/sitl/bin/*; do
            name=$(basename "$f")
            [ -x "$f" ] && [ -f "$f" ] && cp "$f" "output/${name}-${{ matrix.suffix }}"
          done
          ls -lh output/

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in output/*; do
            gh release upload "${{ needs.release.outputs.tag }}" "$f" --clobber
          done
